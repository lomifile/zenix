# zenix: search paths for tmux-sessionizer.
#
# Linked to ~/.config/tmux-sessionizer/tmux-sessionizer.conf, which the script
# sources before doing anything else. Without it the upstream defaults apply
# (~/ ~/personal ~/personal/dev/env/.config), which would scan the whole home
# directory and miss every project here.
#
# Sourced by bash, so these are bash arrays. A path may be suffixed with
# :<depth> to override TS_MAX_DEPTH for that entry alone.
TS_SEARCH_PATHS=(~/work ~/learn ~/build ~/projects)
TS_MAX_DEPTH=1
