[General]
# Palette lifted from hypr/hyprlock.conf and waybar/waybar-style.css so the
# greeter, the lock screen and the bar all read as one surface.
# >>> zenix theme <<<
backgroundColor=#1c1c1e
textColor=#f5f5f7
dimTextColor=#98989d
accentColor=#0a84ff
errorColor=#ff453a
popupColor=#2c2c2e
washSoft=#14ffffff
wash=#1affffff
washBorder=#1fffffff
washHover=#24ffffff
washStrong=#29ffffff
# >>> end zenix theme <<<

# Relative to this directory. install.sh copies the active wallpaper here.
# Clear it to fall back to a flat backgroundColor.
background=background.png
backgroundDimming=0.55
backgroundBlur=0

fontFamily=SF Pro Display
fallbackFontFamily=Inter
clockFontSize=86
