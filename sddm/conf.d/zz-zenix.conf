# Installed to /etc/sddm.conf.d/zz-zenix.conf by install.sh.
#
# sddm.conf(5): configuration loads every file in the directory "with the
# latter having highest precedence" -- sorted order, last one wins. So the
# name has to sort AFTER anything else that sets Current=, and the packages
# that do are kde_settings.conf and 00_manjaro_settings.conf. A 99- prefix is
# not enough: 'k' sorts after '9'. 'zz-' clears both.

[Theme]
Current=zenix
CursorTheme=macOS
CursorSize=24

[General]
Numlock=on

[Users]
RememberLastUser=true
RememberLastSession=true
