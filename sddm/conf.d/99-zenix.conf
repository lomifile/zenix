# Installed to /etc/sddm.conf.d/99-zenix.conf by install.sh.
#
# SDDM reads /etc/sddm.conf.d/* in lexical order and later files win, so the
# 99- prefix keeps this ahead of anything a package might drop in (Manjaro's
# 00_manjaro_settings.conf and KDE's kde_settings.conf both set Current=).

[Theme]
Current=zenix
CursorTheme=macOS
CursorSize=24

[General]
Numlock=on

[Users]
RememberLastUser=true
RememberLastSession=true
