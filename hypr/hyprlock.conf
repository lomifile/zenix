background {
    monitor =
    # Same image as the SDDM greeter, so locking and logging in match.
    # install.sh rewrites this path -- hyprlock does not expand $HOME.
    path = /home/f/Pictures/wallpaper/couple-bus-sunset.jpg
    # shown if the image is missing
    color = rgba(28, 28, 30, 1.0)
    # the greeter dims its wallpaper to 0.55; this is the closest equivalent,
    # and the text above needs it to stay legible over a photo
    brightness = 0.55
    contrast = 1.0
    vibrancy = 0.17
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = rgba(0a84ffee)
    inner_color = rgba(1c1c1eee)
    font_color = rgba(f5f5f7ff)
    placeholder_text = <span foreground="##98989d">Password</span>
    fade_on_empty = false
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(f5f5f7ff)
    font_size = 90
    font_family = SF Pro Display, Inter
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%A, %d %B')"
    color = rgba(98989dff)
    font_size = 20
    font_family = SF Pro Display, Inter
    position = 0, 40
    halign = center
    valign = center
}
