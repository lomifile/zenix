# colors config
# NOTE: This is important because if this is not set
# vim disables truecolor and colors are not rendered properly

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",$TERM:RGB"
set-option -g status-position top

# vim binds
set-option -sg escape-time 10
set-option -g focus-events on

# Basic binds
# run-shell, not source-file: tmux expands $VAR but not shell-style
# ${VAR:-default}, so the XDG fallback has to happen in a real shell.
bind r run-shell 'tmux source-file "${XDG_CONFIG_HOME:-$HOME/.config}/tmux/tmux.conf" && tmux display-message "tmux.conf reloaded"'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind-key m set-option -g mouse \; display-message 'Mouse #{?mouse,on,off}'

unbind '"'
unbind %

# Start window and pane indices at 1.
set -g base-index 1
set -g pane-base-index 0

# Vim keybinds
set-window-option -g mode-keys vi

bind -T copy-mode-vi v send-keys -X begin-selection
# Wayland clipboard: xclip only reaches the XWayland clipboard, so use wl-copy.
# copy-command is the server-wide default, so mouse-drag selections use it too.
# Falls back to xclip on plain X11 / forwarded-X sessions where there is no
# Wayland socket. WAYLAND_DISPLAY is in tmux's default update-environment, so
# the branch stays correct across detach/reattach.
set -s copy-command 'if [ -n "$WAYLAND_DISPLAY" ]; then wl-copy; else xclip -in -selection clipboard; fi'
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel

bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R


# Length of tmux status line
set -g status-left-length 30
set -g status-right-length 150

set-option -g status "on"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'


set -g @plugin "janoamaral/tokyo-night-tmux"
set -g @tokyo-night-tmux_theme storm   # night (default) | storm | moon | day
set -g @tokyo-night-tmux_transparent 1 # transparent background

set -g @tokyo-night-tmux_show_git 1             # local git status
set -g @tokyo-night-tmux_show_wbg 1             # GitHub / GitLab stats
# set -g @tokyo-night-tmux_show_netspeed 1        # network speed
set -g @tokyo-night-tmux_show_battery_widget 1  # battery level
set -g @tokyo-night-tmux_show_music 1           # now playing
# set -g @tokyo-night-tmux_show_path 1            # current path
set -g @tokyo-night-tmux_show_hostname 1        # machine hostname

run '~/.tmux/plugins/tpm/tpm'
